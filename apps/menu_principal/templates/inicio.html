{% extends 'base.html' %}

{% block title %}Dashboard - Ferticore{% endblock %}

{% block content %}
{% load static %}
{{Pendentes}}
    
    
    <!-- Conteúdo principal -->
    <div class="content" id="content" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000;">
        <div style="width: 80%; max-width: 800px;">
            <canvas id="myChart" style="width: 100%; height: 400px;"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script>
            // Passando os totais dos pedidos para o gráfico
            const pedidosPendentes = {{ Pendentes|default:0 }};
            const pedidosConcluidos = {{ Concluídos|default:0 }};
            const pedidosCancelados = {{ Cancelados|default:0 }};
            
            // Verifique se os valores são realmente números
            console.log(pedidosPendentes, pedidosConcluidos, pedidosCancelados);
            
            const ctx = document.getElementById('myChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pendentes', 'Concluídos', 'Cancelados'],
                    datasets: [{
                        label: 'Total de Pedidos (R$)',
                        data: [pedidosPendentes, pedidosConcluidos, pedidosCancelados],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.8)',  // Cor para Pendentes
                            'rgba(153, 102, 255, 0.8)', // Cor para Concluídos
                            'rgba(255, 159, 64, 0.8)'   // Cor para Cancelados
                        ],
                        borderColor: [
                            'rgba(75, 192, 192, 1)', 
                            'rgba(153, 102, 255, 1)', 
                            'rgba(255, 159, 64, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // Permite ajustar o gráfico ao tamanho do contêiner
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#f4f1e0', // Texto de números em cor clara
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)', // Linhas da grade em cor clara
                            }
                        },
                        x: {
                            ticks: {
                                color: '#f4f1e0' // Texto dos labels do eixo X em cor clara
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)', // Linhas da grade em cor clara
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#f4f1e0' // Cor das legendas em branco
                            }
                        }
                    },
                    elements: {
                        bar: {
                            borderRadius: 5, // Barras com borda arredondada
                        }
                    },
                    backgroundColor: '#000000', // Fundo preto para o gráfico
                    layout: {
                        padding: {
                            top: 30, 
                            bottom: 30
                        }
                    }
                }
            });
        </script>
    </div>
{% endblock %}
